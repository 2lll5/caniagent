name: CanIAgent compatibility check
description: Scan a repository for coding-agent migration compatibility and optionally upload SARIF.
author: 2lll5
branding:
  icon: check-circle
  color: green

inputs:
  agent:
    description: Target coding agent (codex, claude-code, gemini-cli, opencode)
    required: true
    default: codex
  path:
    description: Repository path to scan
    required: false
    default: .
  upload-sarif:
    description: "Upload findings to GitHub code scanning. Caller needs security-events: write."
    required: false
    default: "true"

outputs:
  sarif:
    description: Path to the generated SARIF file
    value: ${{ steps.scan.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CANIAGENT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
      run: |
        case "$CANIAGENT_UPLOAD_SARIF" in
          true|false) ;;
          *) echo "caniagent: upload-sarif must be 'true' or 'false'" >&2; exit 1 ;;
        esac

    - id: scan
      name: Scan coding-agent compatibility
      shell: bash
      env:
        CANIAGENT_SARIF: ${{ runner.temp }}/caniagent.sarif
        CANIAGENT_PATH: ${{ inputs.path }}
        CANIAGENT_AGENT: ${{ inputs.agent }}
      run: |
        node "$GITHUB_ACTION_PATH/src/cli.js" check "$CANIAGENT_PATH" --agent "$CANIAGENT_AGENT" --format sarif --output "$CANIAGENT_SARIF"
        echo "sarif=$CANIAGENT_SARIF" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
