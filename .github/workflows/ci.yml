name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - name: CLI smoke test
        run: node src/cli.js matrix --search mcp
      - name: SARIF smoke test
        shell: bash
        run: |
          node src/cli.js check . --agent claude-code --format sarif --output "$RUNNER_TEMP/caniagent.sarif"
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync(process.argv[1])); if(s.version!=='2.1.0') process.exit(1)" "$RUNNER_TEMP/caniagent.sarif"

  package-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Pack npm artifact
        shell: bash
        run: npm pack --json > "$RUNNER_TEMP/caniagent-pack.json"
      - name: Install and run packed CLI
        shell: bash
        run: |
          tarball=$(node -e "const p=require(process.argv[1]); process.stdout.write(p[0].filename)" "$RUNNER_TEMP/caniagent-pack.json")
          mkdir "$RUNNER_TEMP/caniagent-package-smoke"
          cd "$RUNNER_TEMP/caniagent-package-smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$tarball"
          npx --no-install caniagent matrix --search mcp

  action-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: caniagent
        uses: ./
        with:
          agent: claude-code
          upload-sarif: "false"
      - name: Check action output
        shell: bash
        run: test -s "${{ steps.caniagent.outputs.sarif }}"
      - name: Create threshold fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/caniagent-threshold-fixture"
          printf '# Claude-only project instructions\n' > "$RUNNER_TEMP/caniagent-threshold-fixture/CLAUDE.md"
      - id: threshold
        name: Exercise fail-on threshold
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/caniagent-threshold-fixture
          agent: codex
          upload-sarif: "false"
          fail-on: warning
      - name: Check threshold failure preserves SARIF
        if: ${{ always() }}
        shell: bash
        env:
          THRESHOLD_OUTCOME: ${{ steps.threshold.outcome }}
          THRESHOLD_SARIF: ${{ steps.threshold.outputs.sarif }}
        run: |
          test "$THRESHOLD_OUTCOME" = failure
          test -s "$THRESHOLD_SARIF"
